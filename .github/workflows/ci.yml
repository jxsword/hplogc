name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 主矩阵：Linux / macOS / Windows(MSVC) × 有锁 / 无锁 ring
  # ---------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'ubuntu / locked',          os: ubuntu-latest,   ring: locked }
          - { name: 'ubuntu / lockfree',        os: ubuntu-latest,   ring: lockfree }
          - { name: 'macos / locked',           os: macos-latest,    ring: locked }
          - { name: 'macos / lockfree',         os: macos-latest,    ring: lockfree }
          - { name: 'windows-msvc / locked',    os: windows-latest,  ring: locked }
          - { name: 'windows-msvc / lockfree',  os: windows-latest,  ring: lockfree }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.ring == 'lockfree' && '-DHPLOGC_LOCKFREE=ON' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Diagnose crash (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          lldb --batch -o "run" -o "bt all" -o "quit" -- ./build/tests/test_smoke 2>&1 | tail -40 || true

  # ---------------------------------------------------------------------------
  # Windows 第二工具链：MinGW-w64（GCC），由 MSYS2 提供
  # 与 MSVC 互为补充，覆盖两套编译器对平台层的差异（§11）
  # ---------------------------------------------------------------------------
  windows-mingw:
    name: windows-mingw ${{ matrix.msystem }} / ${{ matrix.ring }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        # 32 位（MINGW32 / i686）与 64 位（MINGW64 / x86_64）两套工具链都装、都测
        msystem: [MINGW32, MINGW64]
        ring: [locked, lockfree]
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-make
            mingw-w64-i686-cmake
            mingw-w64-i686-gdb
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gdb

      - name: Configure
        run: >
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.ring == 'lockfree' && '-DHPLOGC_LOCKFREE=ON' || '' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Diagnose crash (MinGW)
        if: failure()
        run: |
          cmake -S . -B build-dbg -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Debug -DHPLOGC_LOCKFREE=${{ matrix.ring == 'lockfree' && 'ON' || 'OFF' }}
          cmake --build build-dbg --parallel
          gdb -batch -ex "run" -ex "bt" -ex "info registers" --args ./build-dbg/tests/test_smoke.exe 2>&1 | tail -40 || true

  # ---------------------------------------------------------------------------
  # Sanitizer：ASan + UBSan（仅 Linux；MSVC 不支持，MinGW 支持有限）
  # ---------------------------------------------------------------------------
  sanitizer:
    name: sanitizer / ${{ matrix.ring }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ring: [locked, lockfree]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          ${{ matrix.ring == 'lockfree' && '-DHPLOGC_LOCKFREE=ON' || '' }}

      - name: Build
        run: cmake --build build-asan --config Debug --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  # ---------------------------------------------------------------------------
  # 覆盖率：本迭代**仅生成并归档报告、不设阈值**
  # （与 rd §18 C7 的"报告项"口径一致：硬门禁 + 报告项）。
  # 阈值收口留待下一迭代按实际水位决定——本地基线为：
  # lines 46.5% / functions 62.4% / branches 32.7%（gcovr 8.6，仅单测用例）。
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage report (no threshold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pip install gcovr

      - name: Configure (coverage instrumentation)
        run: >
          cmake -S . -B build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DHPLOGC_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-cov --config Debug --parallel

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      - name: Generate report
        run: >
          gcovr --root . build-cov
          --exclude '.*/tests/.*' --exclude '.*/examples/.*' --exclude '.*/build.*'
          --html-details build-cov/coverage.html
          --xml build-cov/coverage.xml
          --print-summary

      - name: Archive report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-cov/coverage.html
            build-cov/coverage.html.*
            build-cov/coverage.xml
          if-no-files-found: warn
